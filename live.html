<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Subscriber Count — VOULGE</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<meta name="color-scheme" content="dark">
<script>document.documentElement.className+=" js";setTimeout(function(){if(!window.VOULGE_READY)document.documentElement.className=document.documentElement.className.replace(" js","")},2500)</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap">

<body>
<div id="glow"></div><div id="prog"></div>
<header id="hd">
  <a class="logo" href="/"><svg viewBox="0 0 14 28"><path d="M7 0 14 12 9 28H5L0 12Z" fill="#f4f5f6"/></svg>VOULGE</a>
  <a class="btn g" href="/" style="padding:12px 26px">Back to site</a>
</header>

<main>
<div class="page" id="live">
<section class="s" style="padding-top:130px"><div class="wrap">
  <div class="eb rv">Live</div>
  <h2 class="rv" style="--d:1">Live subscriber count</h2>
  <p class="lead rv" style="--d:2">Counts up on its own while you watch. Every milestone gets a celebration.</p>
  <div class="lv rv" style="--d:3">
    <button class="fsb" id="lvfs" type="button" aria-label="Fullscreen" title="Fullscreen"><svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    <div class="lvh"><i class="ld"></i>Live</div>
    <div class="odo" id="odo" aria-live="polite"><span class="cm">—</span></div>
    <div class="lvs">subscribers</div>
    <div class="lvm"><span id="lvgain">+0 since you opened this page</span><span id="lvup">Waiting for data…</span></div>
    <div class="lvp">
      <div class="lvt"><span>Next milestone <b id="lvnext">—</b></span><span id="lvtogo"></span></div>
      <div class="pb"><i id="lvbar"></i></div>
    </div>
  </div>
  <div class="eb rv" style="margin-top:46px">Milestones</div>
  <div class="ms rv" id="ms"></div>
  <div class="btns rv" style="margin-top:28px"><button class="btn g mag" id="lvtest" type="button">Preview celebration</button></div>
</div></section>
</div>
</main>

<footer><div class="wrap"><span>© 2026 Voulge</span><span>Orion Drift creator</span></div></footer>

<div id="cel" role="dialog" aria-modal="true" aria-label="Milestone celebration">
  <canvas id="celc"></canvas>
  <div class="cb2"><small>Milestone reached</small><b id="celn">1,000</b><span>subscribers</span><p id="celm"></p><button class="btn" id="celx" type="button">Close</button></div>
</div>

<script src="/config.js?v=13"></script>
<script src="/live.js?v=13"></script>

</html>
